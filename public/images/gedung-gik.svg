<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#E0F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="building" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#sky)"/>
  
  <!-- Clouds -->
  <ellipse cx="200" cy="80" rx="80" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="250" cy="70" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="160" cy="75" rx="50" ry="22" fill="white" opacity="0.8"/>
  
  <ellipse cx="900" cy="100" rx="90" ry="32" fill="white" opacity="0.7"/>
  <ellipse cx="960" cy="88" rx="70" ry="28" fill="white" opacity="0.7"/>
  <ellipse cx="850" cy="95" rx="55" ry="24" fill="white" opacity="0.7"/>
  
  <!-- Sun -->
  <circle cx="1050" cy="100" r="50" fill="#FFD54F" opacity="0.6"/>
  
  <!-- Far mountains/hills -->
  <path d="M0 400 Q200 300 400 380 Q600 320 800 370 Q1000 300 1200 360 L1200 600 L0 600 Z" fill="#81C784" opacity="0.4"/>
  
  <!-- Ground -->
  <rect x="0" y="500" width="1200" height="100" fill="url(#ground)"/>
  <path d="M0 500 Q300 490 600 500 Q900 510 1200 500 L1200 510 Q900 520 600 510 Q300 500 0 510 Z" fill="#66BB6A"/>
  
  <!-- Trees left -->
  <g transform="translate(80, 400)">
    <rect x="-5" y="60" width="10" height="40" fill="#5D4037"/>
    <ellipse cx="0" cy="50" rx="30" ry="40" fill="#2E7D32"/>
    <ellipse cx="-10" cy="60" rx="25" ry="35" fill="#388E3C"/>
    <ellipse cx="10" cy="55" rx="25" ry="35" fill="#43A047"/>
  </g>
  <g transform="translate(140, 410)">
    <rect x="-4" y="50" width="8" height="40" fill="#5D4037"/>
    <ellipse cx="0" cy="42" rx="25" ry="32" fill="#2E7D32"/>
    <ellipse cx="8" cy="48" rx="20" ry="28" fill="#388E3C"/>
  </g>
  
  <!-- Trees right -->
  <g transform="translate(1050, 400)">
    <rect x="-5" y="60" width="10" height="40" fill="#5D4037"/>
    <ellipse cx="0" cy="50" rx="30" ry="40" fill="#2E7D32"/>
    <ellipse cx="-10" cy="60" rx="25" ry="35" fill="#388E3C"/>
    <ellipse cx="10" cy="55" rx="25" ry="35" fill="#43A047"/>
  </g>
  <g transform="translate(1120, 410)">
    <rect x="-4" y="50" width="8" height="40" fill="#5D4037"/>
    <ellipse cx="0" cy="42" rx="25" ry="32" fill="#2E7D32"/>
    <ellipse cx="8" cy="48" rx="20" ry="28" fill="#388E3C"/>
  </g>
  
  <!-- Main Building (GIK FMIPA) -->
  <!-- Building roof/top accent -->
  <rect x="200" y="150" width="800" height="20" fill="#0D47A1" rx="3"/>
  
  <!-- Building upper flag pole -->
  <rect x="594" y="110" width="12" height="50" fill="#757575"/>
  <rect x="594" y="110" width="60" height="30" fill="#FF3D00"/>
  <rect x="594" y="110" width="60" height="15" fill="#FF3D00"/>
  <rect x="594" y="125" width="60" height="15" fill="white"/>
  
  <!-- Main building body -->
  <rect x="200" y="170" width="800" height="330" fill="url(#buildingFace)"/>
  
  <!-- Building columns/pillars -->
  <rect x="220" y="170" width="20" height="330" fill="#1565C0"/>
  <rect x="970" y="170" width="20" height="330" fill="#1565C0"/>
  <rect x="380" y="170" width="15" height="330" fill="#1565C0" opacity="0.6"/>
  <rect x="540" y="170" width="15" height="330" fill="#1565C0" opacity="0.6"/>
  <rect x="645" y="170" width="15" height="330" fill="#1565C0" opacity="0.6"/>
  <rect x="805" y="170" width="15" height="330" fill="#1565C0" opacity="0.6"/>
  
  <!-- Windows row 1 (3rd floor) -->
  <g fill="#E3F2FD" stroke="#90CAF9" stroke-width="1">
    <rect x="240" y="200" width="120" height="70" rx="4"/>
    <rect x="395" y="200" width="120" height="70" rx="4"/>
    <rect x="555" y="200" width="90" height="70" rx="4"/>
    <rect x="660" y="200" width="120" height="70" rx="4"/>
    <rect x="820" y="200" width="120" height="70" rx="4"/>
  </g>
  <!-- Window reflections -->
  <g fill="#BBDEFB" opacity="0.5">
    <rect x="240" y="200" width="30" height="70" rx="4"/>
    <rect x="395" y="200" width="30" height="70" rx="4"/>
    <rect x="820" y="200" width="30" height="70" rx="4"/>
  </g>
  
  <!-- Windows row 2 (2nd floor) -->
  <g fill="#E3F2FD" stroke="#90CAF9" stroke-width="1">
    <rect x="240" y="295" width="120" height="70" rx="4"/>
    <rect x="395" y="295" width="120" height="70" rx="4"/>
    <rect x="555" y="295" width="90" height="70" rx="4"/>
    <rect x="660" y="295" width="120" height="70" rx="4"/>
    <rect x="820" y="295" width="120" height="70" rx="4"/>
  </g>
  <g fill="#BBDEFB" opacity="0.5">
    <rect x="240" y="295" width="30" height="70" rx="4"/>
    <rect x="395" y="295" width="30" height="70" rx="4"/>
    <rect x="820" y="295" width="30" height="70" rx="4"/>
  </g>
  
  <!-- Windows row 3 (1st floor) -->
  <g fill="#E3F2FD" stroke="#90CAF9" stroke-width="1">
    <rect x="240" y="388" width="100" height="60" rx="4"/>
    <rect x="370" y="388" width="100" height="60" rx="4"/>
    <rect x="840" y="388" width="100" height="60" rx="4"/>
    <rect x="960" y="388" width="30" height="60" rx="4"/>
  </g>
  
  <!-- Building sign -->
  <rect x="440" y="390" width="320" height="55" fill="#1A237E" rx="5"/>
  <text x="600" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GEDUNG ILMU KOMPUTER</text>
  <text x="600" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#90CAF9">FMIPA Universitas Lampung</text>
  
  <!-- Main entrance door -->
  <rect x="545" y="455" width="110" height="45" fill="#0D47A1" rx="3"/>
  <rect x="550" y="460" width="45" height="40" fill="#1565C0" rx="2"/>
  <rect x="605" y="460" width="45" height="40" fill="#1565C0" rx="2"/>
  <!-- Door handles -->
  <circle cx="595" cy="480" r="3" fill="#FFD54F"/>
  <circle cx="605" cy="480" r="3" fill="#FFD54F"/>
  
  <!-- Entrance steps -->
  <rect x="510" y="495" width="180" height="5" fill="#9E9E9E" rx="2"/>
  
  <!-- Path/road -->
  <path d="M500 500 Q600 502 700 500 L700 600 L500 600 Z" fill="#B0BEC5" opacity="0.5"/>
  
  <!-- Small decorative palm trees near entrance -->
  <g transform="translate(490, 450)">
    <rect x="-3" y="20" width="6" height="30" fill="#795548"/>
    <path d="M0 20 Q-20 0 -30 -10 M0 20 Q-10 -5 0 -20 M0 20 Q10 -5 20 -15 M0 20 Q20 5 30 -5" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(710, 450)">
    <rect x="-3" y="20" width="6" height="30" fill="#795548"/>
    <path d="M0 20 Q-20 0 -30 -10 M0 20 Q-10 -5 0 -20 M0 20 Q10 -5 20 -15 M0 20 Q20 5 30 -5" stroke="#4CAF50" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
